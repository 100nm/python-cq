site_name: python-cq
site_url: https://python-cq.remimd.dev

repo_name: 100nm/python-cq
repo_url: https://github.com/100nm/python-cq

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Routing:
      - Messages and handlers: routing/messages.md
      - Dispatching messages: routing/dispatching.md
      - Configuring a bus: routing/configuring.md
      - Middlewares: routing/middlewares.md
      - Executing multiple commands: routing/multiple_commands.md
      - Custom DI adapter: routing/di.md
  - Queuing:
      - Queues: queuing/queues.md
      - Pump: queuing/pump.md
  - Integrations:
      - python-injection: integrations/injection.md

plugins:
  - search

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: indigo
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.expand
    - navigation.footer
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
